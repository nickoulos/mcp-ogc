[project]
name = "mcp-ogc"
version = "0.1.0"
description = "Expose OGC WMS and WFS geospatial services as Model Context Protocol tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Foursight Lab" }]
dependencies = [
    "mcp>=1.2",
    "owslib>=0.31",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.scripts]
mcp-ogc = "mcp_ogc.server:main"

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "responses>=0.26.1",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
